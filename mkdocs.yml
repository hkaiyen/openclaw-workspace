site_name: 小安研究團隊每日報告
site_description: 小安研究團隊每日報告自動發布平台
site_author: 小安研究團隊
site_url: https://reportssite.vercel.app

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: 切換深色模式
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切換淺色模式
  font:
    text: Noto Sans TC
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - 🏠 首頁: index.md
  - 📰 新聞快報: reports/新聞/全方位新聞快報_20260507_1507.html
  - 📈 股市報告: reports/股市.md
  - 📚 研究報告: reports/研究.md
  - 💡 創業靈感: reports/創業.md
  - 🛒 促銷報告: reports/促銷.md
  - 🎮 遊戲專區: games/index.md

plugins:
  - search
  - rss:
      enabled: true
      rss_feed_enabled: true
      json_feed_enabled: true
      feeds_filenames:
        rss_created: feed.xml
        json_created: feed.json
      use_git: true
      length: 20
      match_path: '.*'
      date_from_meta:
        as_creation: git
        as_update: git
        datetime_format: '%Y-%m-%d'
      categories: []
  - print-site

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.snippets
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
