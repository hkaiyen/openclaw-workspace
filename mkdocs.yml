site_name: 小安研究團隊每日報告
site_description: 小安研究團隊每日報告自動發布平台
site_author: 小安研究團隊
site_url: https://reportssite.vercel.app
site_logo: https://cdn-icons-png.flaticon.com/512/2103/2103633.png

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: 切換深色模式
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: 切換淺色模式
  font:
    text: Noto Sans TC
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - 🏠 首頁: index.md
  - 📋 報告列表:
    - 📈 股市與投資: reports/股市.md
    - 📚 研究報告: reports/研究.md
    - 💡 創業專區: reports/創業.md
    - 🛒 促銷報告: reports/促銷.md
    - 📰 新聞快報: reports/新聞.md
    - 💡 產業研究: reports/產業研究.md
    - 🚀 科技新知: reports/科技新知.md
    - 🏥 健康專欄: reports/健康專欄.md
    - 📚 專題報告: reports/專題報告.md
  - 🎮 遊戲專區: games/index.md

plugins:
  - search

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.snippets
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - js/search_suggestions.js