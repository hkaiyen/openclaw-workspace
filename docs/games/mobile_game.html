<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐍 蛇蛇大作戰</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
    touch-action: none;
  }
  #gameArea {
    position: relative;
    text-align: center;
  }
  #scoreBoard {
    color: #fff;
    font-size: 18px;
    margin-bottom: 10px;
    text-shadow: 0 0 10px rgba(0,255,150,0.5);
  }
  #gameCanvas {
    background: #0f0f23;
    border-radius: 12px;
    box-shadow: 0 0 30px rgba(0,200,255,0.3);
    display: block;
    margin: 0 auto;
  }
  #startScreen, #gameOverScreen {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(15,15,35,0.95);
    border-radius: 12px;
    color: #fff;
  }
  #startScreen h1 {
    font-size: 36px;
    margin-bottom: 20px;
    text-shadow: 0 0 20px #00ffc8;
  }
  .btn {
    background: linear-gradient(135deg, #00b894, #00cec9);
    color: #fff;
    border: none;
    padding: 15px 40px;
    font-size: 20px;
    border-radius: 30px;
    cursor: pointer;
    margin-top: 20px;
    box-shadow: 0 5px 20px rgba(0,206,201,0.4);
    transition: transform 0.2s;
  }
  .btn:active { transform: scale(0.95); }
  #finalScore {
    font-size: 28px;
    color: #ffeaa7;
    margin: 15px 0;
  }
  #highScore {
    font-size: 16px;
    color: #81ecec;
    margin-bottom: 10px;
  }
  .controls {
    margin-top: 15px;
    color: #a29bfe;
    font-size: 14px;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="gameArea">
  <div id="scoreBoard">分數：<span id="score">0</span> | 最高：<span id="high">0</span></div>
  <canvas id="gameCanvas"></canvas>
  <div id="startScreen">
    <h1>🐍 蛇蛇大作戰</h1>
    <p style="color:#a29bfe">用方向鍵或滑動控制蛇蛇</p>
    <button class="btn" id="startBtn">開始遊戲</button>
    <p class="controls">👆 滑動 / ⬆⬇⬅➡ 鍵盤 / WASD</p>
  </div>
  <div id="gameOverScreen" class="hidden">
    <h1 style="font-size:32px">遊戲結束</h1>
    <div id="finalScore">0</div>
    <div id="highScore">最高分：0</div>
    <button class="btn" id="restartBtn">再玩一次</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// 根據手機螢幕調整畫布大小
const screenW = Math.min(window.innerWidth - 20, 400);
const screenH = Math.min(window.innerHeight - 100, 500);
canvas.width = screenW;
canvas.height = screenH;

const gridSize = 20;
const cols = Math.floor(canvas.width / gridSize);
const rows = Math.floor(canvas.height / gridSize);

let snake, dir, food, score, gameLoop, highScore = localStorage.getItem('snakeHigh') || 0;
document.getElementById('high').textContent = highScore;

function init() {
  snake = [{ x: Math.floor(cols/2), y: Math.floor(rows/2) }];
  dir = { x: 1, y: 0 };
  score = 0;
  document.getElementById('score').textContent = '0';
  spawnFood();
}

function spawnFood() {
  let valid = false;
  while (!valid) {
    food = {
      x: Math.floor(Math.random() * cols),
      y: Math.floor(Math.random() * rows)
    };
    valid = !snake.some(s => s.x === food.x && s.y === food.y);
  }
}

function draw() {
  // 清除畫布
  ctx.fillStyle = '#0f0f23';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 畫格線（淺色）
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  for (let x = 0; x <= cols; x++) {
    ctx.beginPath();
    ctx.moveTo(x * gridSize, 0);
    ctx.lineTo(x * gridSize, canvas.height);
    ctx.stroke();
  }
  for (let y = 0; y <= rows; y++) {
    ctx.beginPath();
    ctx.moveTo(0, y * gridSize);
    ctx.lineTo(canvas.width, y * gridSize);
    ctx.stroke();
  }

  // 畫食物（發光愛心）
  const fx = food.x * gridSize + gridSize/2;
  const fy = food.y * gridSize + gridSize/2;
  const gradient = ctx.createRadialGradient(fx, fy, 2, fx, fy, gridSize);
  gradient.addColorStop(0, '#ff6b6b');
  gradient.addColorStop(1, 'rgba(255,107,107,0)');
  ctx.fillStyle = gradient;
  ctx.beginPath();
  ctx.arc(fx, fy, gridSize, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ff6b6b';
  ctx.font = '16px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🍎', fx, fy);

  // 畫蛇
  snake.forEach((seg, i) => {
    const sx = seg.x * gridSize;
    const sy = seg.y * gridSize;
    
    if (i === 0) {
      // 蛇頭
      ctx.fillStyle = '#00b894';
      ctx.shadowColor = '#00b894';
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.roundRect(sx+2, sy+2, gridSize-4, gridSize-4, 5);
      ctx.fill();
      ctx.shadowBlur = 0;
      
      // 眼睛
      ctx.fillStyle = '#fff';
      const eyeOffset = dir.x !== 0 ? 4 : 0;
      const eyeOffsetY = dir.y !== 0 ? 4 : 0;
      ctx.beginPath();
      ctx.arc(sx + gridSize/2 - 4 + eyeOffsetY, sy + gridSize/2 - 4 + eyeOffset, 2.5, 0, Math.PI*2);
      ctx.arc(sx + gridSize/2 + 4 + eyeOffsetY, sy + gridSize/2 - 4 + eyeOffset, 2.5, 0, Math.PI*2);
      ctx.fill();
    } else {
      // 蛇身（漸層）
      const alpha = Math.max(0.4, 1 - i * 0.03);
      ctx.fillStyle = `rgba(0,206,201,${alpha})`;
      ctx.beginPath();
      ctx.roundRect(sx+3, sy+3, gridSize-6, gridSize-6, 4);
      ctx.fill();
    }
  });
}

function update() {
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  
  // 撞牆
  if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) {
    endGame(); return;
  }
  // 撞自己
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    endGame(); return;
  }
  
  snake.unshift(head);
  
  // 吃到食物
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    document.getElementById('score').textContent = score;
    spawnFood();
  } else {
    snake.pop();
  }
  
  draw();
}

function endGame() {
  clearInterval(gameLoop);
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('snakeHigh', highScore);
    document.getElementById('high').textContent = highScore;
  }
  document.getElementById('finalScore').textContent = '🎯 ' + score + ' 分';
  document.getElementById('highScore').textContent = '最高分：' + highScore;
  document.getElementById('gameOverScreen').classList.remove('hidden');
}

function startGame() {
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('gameOverScreen').classList.add('hidden');
  init();
  draw();
  gameLoop = setInterval(update, 120);
}

// 鍵盤控制
document.addEventListener('keydown', e => {
  const key = e.key.toLowerCase();
  if ((key === 'arrowup' || key === 'w') && dir.y !== 1) dir = { x: 0, y: -1 };
  else if ((key === 'arrowdown' || key === 's') && dir.y !== -1) dir = { x: 0, y: 1 };
  else if ((key === 'arrowleft' || key === 'a') && dir.x !== 1) dir = { x: -1, y: 0 };
  else if ((key === 'arrowright' || key === 'd') && dir.x !== -1) dir = { x: 1, y: 0 };
});

// 觸控滑動控制
let touchStartX, touchStartY;
canvas.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('touchend', e => {
  if (!touchStartX) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  
  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 20 && dir.x !== -1) dir = { x: 1, y: 0 };
    else if (dx < -20 && dir.x !== 1) dir = { x: -1, y: 0 };
  } else {
    if (dy > 20 && dir.y !== -1) dir = { x: 0, y: 1 };
    else if (dy < -20 && dir.y !== 1) dir = { x: 0, y: -1 };
  }
  touchStartX = null;
  touchStartY = null;
}, { passive: true });

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);

// 繪製圓角矩形（兼容）
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
  };
}
</script>
</body>
</html>
